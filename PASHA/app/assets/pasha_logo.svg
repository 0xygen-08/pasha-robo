<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Robot Gövdesi -->
  <rect x="10" y="14" width="80" height="72" rx="20" fill="#121826" stroke="#2a364f" stroke-width="3" />
  
  <!-- Minik Anten -->
  <line x1="50" y1="14" x2="50" y2="5" stroke="#4facfe" stroke-width="4" stroke-linecap="round" />
  <circle cx="50" cy="5" r="4" fill="#00f2fe" filter="url(#neon)" />

  <!-- OLED Ekran Alanı -->
  <rect x="18" y="22" width="64" height="48" rx="10" fill="#05070c" stroke="#1f293d" stroke-width="2" />

  <!-- Sevimli Gözler -->
  <rect x="28" y="34" width="16" height="20" rx="6" fill="#00f2fe" filter="url(#neon)" />
  <rect x="56" y="34" width="16" height="20" rx="6" fill="#00f2fe" filter="url(#neon)" />

  <!-- Minik Sevimli Yanaklar -->
  <line x1="24" y1="58" x2="27" y2="55" stroke="#ff5e7e" stroke-width="2" stroke-linecap="round" />
  <line x1="28" y1="58" x2="31" y2="55" stroke="#ff5e7e" stroke-width="2" stroke-linecap="round" />
  <line x1="69" y1="55" x2="72" y2="58" stroke="#ff5e7e" stroke-width="2" stroke-linecap="round" />
  <line x1="73" y1="55" x2="76" y2="58" stroke="#ff5e7e" stroke-width="2" stroke-linecap="round" />
</svg>
